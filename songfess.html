<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songfess Aesthetic</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --dark-brown: #5D4037;
            --medium-brown: #8D6E63;
            --creme: #FDF5E6;
            --soft-creme: #FFFBF2;
        }
        body { 
            background-color: var(--creme); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            color: var(--dark-brown);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 450px; }
        
        /* Form Styling */
        .form-box { 
            background: white; padding: 20px; border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(93, 64, 55, 0.1);
            margin-bottom: 30px; border: 1px solid #e0d5c1;
        }
        input, textarea { 
            width: 100%; padding: 10px; margin: 8px 0; 
            border: 1px solid #d7ccc8; border-radius: 8px; 
            background: var(--soft-creme); box-sizing: border-box;
        }
        button#btn-kirim { 
            width: 100%; background: var(--dark-brown); color: white; 
            border: none; padding: 12px; border-radius: 8px; cursor: pointer;
        }

        /* Card Styling */
        .card { 
            background: white; border-radius: 15px; padding: 20px; 
            margin-bottom: 20px; border: 1px solid #e0d5c1;
        }
        
        /* Box khusus yang akan di-screenshot */
        .screenshot-area {
            background: white;
            padding: 15px;
            border-radius: 10px;
        }

        .song-display {
            display: flex;
            align-items: center;
            background: #282828; /* Warna gelap ala Spotify */
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .song-icon { font-size: 24px; margin-right: 12px; }
        .song-info { flex: 1; overflow: hidden; }
        .song-title { font-weight: bold; font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-sub { font-size: 11px; opacity: 0.8; }

        .card p { font-style: italic; margin: 15px 0; border-left: 3px solid var(--medium-brown); padding-left: 10px; }
        
        .action-btns { display: flex; gap: 8px; margin-top: 10px; }
        .btn-small { padding: 6px 12px; border-radius: 20px; border: 1px solid #d7ccc8; background: white; cursor: pointer; font-size: 12px; }
        .btn-down { background: var(--medium-brown); color: white; border: none; }
        
        /* Iframe asli tetap muncul di web tapi tidak masuk screenshot */
        .original-player { margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">☕ Cavalryonix's Songfess Room</h2>

    <div class="form-box">
        <input type="text" id="sender" placeholder="From (Anonim)">
        <input type="text" id="receiver" placeholder="To">
        <input type="text" id="song-name" placeholder="Judul Lagu & Artis (Untuk Gambar)">
        <input type="text" id="song-link" placeholder="Link Spotify Track (Untuk Musik)">
        <textarea id="message" placeholder="Message"></textarea>
        <button id="btn-kirim" onclick="addSongfess()">Kirim 💌</button>
    </div>

    <div id="result"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, getDocs, serverTimestamp, 
  query, orderBy, doc, updateDoc, getDoc, deleteDoc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmWJdT-sumJWd1fKPWvattWKGp9VPFuyk",
  authDomain: "xcavalryonix.firebaseapp.app",
  projectId: "xcavalryonix",
  storageBucket: "xcavalryonix.firebasestorage.app",
  messagingSenderId: "496785985793",
  appId: "1:496785985793:web:56eff97ed61a5c91664b00"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadSongfess() {
  const result = document.getElementById("result");
  if (!result) return;
  result.innerHTML = "<p style='text-align:center'>Loading messages... ☕</p>";

  try {
    const q = query(collection(db, "songfess"), orderBy("waktu", "desc"));
    const snapshot = await getDocs(q);
    result.innerHTML = "";

    snapshot.forEach((documentData) => {
      const item = documentData.data();
      const id = documentData.id;
      const card = document.createElement("div");
      card.className = "card";

      const embedLink = (item.song_link || "").replace("track/", "embed/track/");
      const waktu = item.waktu ? item.waktu.toDate().toLocaleString("id-ID") : "";

      card.innerHTML = `
        <div class="screenshot-area" id="area-${id}">
            <strong>From:</strong> ${item.sender || "Anonim"}<br>
            <strong>To:</strong> ${item.receiver}<br>
            <small>${waktu}</small>
            
            <div class="song-display">
                <div class="song-icon">🎵</div>
                <div class="song-info">
                    <span class="song-title">${item.song_name || "Unknown Song"}</span>
                    <span class="song-sub">Listening on Spotify</span>
                </div>
            </div>

            <p>"${item.message}"</p>
        </div>

        <div class="original-player">
            <iframe src="${embedLink}" width="100%" height="80" frameborder="0" allow="encrypted-media"></iframe>
        </div>

        <div class="action-btns">
            <button class="btn-small" onclick="window.likePost('${id}')">❤️ ${item.likes || 0}</button>
            <button class="btn-small btn-down" onclick="window.downloadCard('${id}')">📸 Simpan ke IG</button>
            <button class="btn-small" style="color:red" onclick="window.deletePost('${id}')">🗑️</button>
        </div>
      `;
      result.appendChild(card);
    });
  } catch (err) { console.error(err); }
}

window.addSongfess = async function() {
  const sender = document.getElementById("sender").value;
  const receiver = document.getElementById("receiver").value;
  const song_name = document.getElementById("song-name").value;
  const song_link = document.getElementById("song-link").value;
  const message = document.getElementById("message").value;

  if(!receiver || !song_link || !message || !song_name) {
    alert("Isi dulu yang lengkap yaa 😠");
    return;
  }

  await addDoc(collection(db, "songfess"), {
    sender, receiver, song_name, song_link, message,
    waktu: serverTimestamp(),
    likes: 0
  });

  alert("Berhasil dikirim 💌");
  location.reload();
};

window.downloadCard = function(id) {
  const target = document.getElementById(`area-${id}`);
  html2canvas(target, { backgroundColor: "#FDF5E6" }).then(canvas => {
    const link = document.createElement('a');
    link.download = `songfess-${id}.png`;
    link.href = canvas.toDataURL();
    link.click();
  });
};

window.likePost = async function(id) {
  const postRef = doc(db, "songfess", id);
  const snap = await getDoc(postRef);
  if (snap.exists()) {
    await updateDoc(postRef, { likes: (snap.data().likes || 0) + 1 });
    loadSongfess();
  }
};

window.deletePost = async function(id) {
  const pass = prompt("Password Admin:");
  if (pass === "satudua3") {
    await deleteDoc(doc(db, "songfess", id));
    loadSongfess();
  }
};

loadSongfess();
</script>
</body>
</html>
