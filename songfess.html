<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  getDocs,
  serverTimestamp,
  query,
  orderBy,
  doc,
  updateDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

document.addEventListener("DOMContentLoaded", () => {

const firebaseConfig = {
  apiKey: "AIzaSyBmWJdT-sumJWd1fKPWvattWKGp9VPFuyk",
  authDomain: "xcavalryonix.firebaseapp.com",
  projectId: "xcavalryonix",
  storageBucket: "xcavalryonix.firebasestorage.app",
  messagingSenderId: "496785985793",
  appId: "1:496785985793:web:56eff97ed61a5c91664b00"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const result = document.getElementById("result");

async function loadSongfess() {
  if (!result) return;

  result.innerHTML = "";

  const q = query(collection(db, "songfess"), orderBy("waktu", "desc"));
  const snapshot = await getDocs(q);

  snapshot.forEach((documentData) => {
    const item = documentData.data();

    const card = document.createElement("div");
    card.className = "card";

    const embedLink = item.song.replace("track/", "embed/track/");

    let waktuFormatted = "";
    if (item.waktu) {
      waktuFormatted = item.waktu.toDate().toLocaleString("id-ID");
    }

    card.innerHTML = `
      <strong>From:</strong> ${item.sender || "Anonim"}<br>
      <strong>To:</strong> ${item.receiver}<br>
      <small>${waktuFormatted}</small><br><br>

      <iframe src="${embedLink}" 
      width="100%" height="80" 
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>

      <p>${item.message}</p>

      <button data-id="${documentData.id}" class="like-btn">
        ❤️ ${item.likes || 0}
      </button>
    `;

    result.appendChild(card);
  });

  // attach event listener after render
  document.querySelectorAll(".like-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-id");
      await likePost(id);
    });
  });
}

async function likePost(id) {
  const postRef = doc(db, "songfess", id);
  const snap = await getDoc(postRef);

  if (!snap.exists()) return;

  const currentLikes = snap.data().likes || 0;

  await updateDoc(postRef, {
    likes: currentLikes + 1
  });

  loadSongfess();
}

window.addSongfess = async function() {

  const sender = document.getElementById("sender").value;
  const receiver = document.getElementById("receiver").value;
  const song = document.getElementById("song").value;
  const message = document.getElementById("message").value;

  if(receiver === "" || song === "" || message === "") {
    alert("Isi dulu yang lengkap yaa 😠");
    return;
  }

  await addDoc(collection(db, "songfess"), {
    sender,
    receiver,
    song,
    message,
    waktu: serverTimestamp(),
    likes: 0
  });

  alert("Berhasil dikirim 💌");

  document.getElementById("sender").value = "";
  document.getElementById("receiver").value = "";
  document.getElementById("song").value = "";
  document.getElementById("message").value = "";

  loadSongfess();
};

loadSongfess();

});
</script>
