<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songfess Aesthetic</title>
    <style>
        :root {
            --dark-brown: #5D4037;
            --medium-brown: #8D6E63;
            --creme: #FDF5E6;
            --soft-creme: #FFFBF2;
        }
        body { 
            background-color: var(--creme); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            color: var(--dark-brown);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 450px; }
        
        /* Form Styling */
        .form-box { 
            background: white; padding: 20px; border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(93, 64, 55, 0.1);
            margin-bottom: 30px; border: 1px solid #e0d5c1;
        }
        input, textarea { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border: 1px solid #d7ccc8; border-radius: 8px; 
            background: var(--soft-creme); color: var(--dark-brown);
            box-sizing: border-box; font-size: 14px;
        }
        button#btn-kirim { 
            width: 100%; background: var(--dark-brown); color: white; 
            border: none; padding: 12px; border-radius: 8px; 
            font-weight: bold; cursor: pointer; margin-top: 10px;
        }

        /* Card Styling */
        .card { 
            background: white; border-radius: 15px; padding: 20px; 
            margin-bottom: 20px; border: 1px solid #e0d5c1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .card strong { color: var(--medium-brown); }
        .card small { color: #a1887f; font-size: 11px; }
        .card p { font-style: italic; margin: 15px 0; border-left: 3px solid #d7ccc8; padding-left: 10px; color: #4e342e; }
        
        .action-btns { display: flex; gap: 8px; margin-top: 15px; }
        .btn-small { 
            padding: 6px 12px; border-radius: 20px; border: 1px solid #d7ccc8; 
            background: white; cursor: pointer; font-size: 12px; color: var(--dark-brown);
        }
        .btn-del { color: #d32f2f; border: none; background: none; font-size: 14px; margin-left: auto; }

        iframe { border-radius: 10px; margin-top: 10px; }
        .footer-note { text-align: center; font-size: 12px; opacity: 0.6; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">☕ Cavalryonix's Songfess Room</h2>

    <div class="form-box">
        <input type="text" id="sender" placeholder="From (Can be anonim)">
        <input type="text" id="receiver" placeholder="To">
        <input type="text" id="song" placeholder="Spotify Link">
        <textarea id="message" placeholder="Write your messages..."></textarea>
        <button id="btn-kirim" onclick="addSongfess()">Send 💌</button>
    </div>

    <div id="result"></div>
    <div class="footer-note">Tips: Screenshot & post ke IG Story! ✨</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, getDocs, serverTimestamp, 
  query, orderBy, doc, updateDoc, getDoc, deleteDoc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmWJdT-sumJWd1fKPWvattWKGp9VPFuyk",
  authDomain: "xcavalryonix.firebaseapp.com",
  projectId: "xcavalryonix",
  storageBucket: "xcavalryonix.firebasestorage.app",
  messagingSenderId: "496785985793",
  appId: "1:496785985793:web:56eff97ed61a5c91664b00"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// LOAD DATA
async function loadSongfess() {
  const result = document.getElementById("result");
  if (!result) return;
  result.innerHTML = "<p style='text-align:center'>Brewing messages... ☕</p>";

  try {
    const q = query(collection(db, "songfess"), orderBy("waktu", "desc"));
    const snapshot = await getDocs(q);
    result.innerHTML = "";

    snapshot.forEach((documentData) => {
      const item = documentData.data();
      const id = documentData.id;
      const card = document.createElement("div");
      card.className = "card";

      const embedLink = (item.song || "").replace("track/", "embed/track/").split("?")[0];
      const waktu = item.waktu ? item.waktu.toDate().toLocaleString("id-ID") : "";

      card.innerHTML = `
        <strong>From:</strong> ${item.sender || "Anonim"}<br>
        <strong>To:</strong> ${item.receiver}<br>
        <small>${waktu}</small><br>
        
        <iframe src="${embedLink}" width="100%" height="80" frameborder="0" allow="encrypted-media"></iframe>
        
        <p>"${item.message}"</p>

        <div class="action-btns">
            <button class="btn-small" onclick="window.likePost('${id}')">❤️ ${item.likes || 0}</button>
            <button class="btn-del" onclick="window.deletePost('${id}')" title="Hapus">🗑️</button>
        </div>
      `;
      result.appendChild(card);
    });
  } catch (err) { console.error(err); }
}

// KIRIM DATA
window.addSongfess = async function() {
  const sender = document.getElementById("sender").value;
  const receiver = document.getElementById("receiver").value;
  const song = document.getElementById("song").value;
  const message = document.getElementById("message").value;

  if(!receiver || !song || !message) {
    alert("Isi dulu yang lengkap yaa 😠");
    return;
  }

  await addDoc(collection(db, "songfess"), {
    sender, receiver, song, message,
    waktu: serverTimestamp(),
    likes: 0
  });

  alert("Berhasil dikirim 💌");
  location.reload();
};

// LIKE
window.likePost = async function(id) {
  const postRef = doc(db, "songfess", id);
  const snap = await getDoc(postRef);
  if (snap.exists()) {
    await updateDoc(postRef, { likes: (snap.data().likes || 0) + 1 });
    loadSongfess();
  }
};

// DELETE (Admin)
window.deletePost = async function(id) {
  const pass = prompt("Masukkan Password Admin:");
  if (pass === "satudua3") { // Ganti password di sini
    await deleteDoc(doc(db, "songfess", id));
    loadSongfess();
  } else if (pass !== null) {
    alert("Password salah! Kamu bukan admin ya? 🤨");
  }
};

loadSongfess();
</script>

</body>
</html>
