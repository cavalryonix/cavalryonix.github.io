<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songfess - Kirim Pesan Lewat Lagu</title>
    <style>
        :root {
            --primary: #ff4d6d;
            --bg: #f8f9fa;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: #333; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        h2 { text-align: center; color: var(--primary); }
        
        /* Form Styling */
        .form-group { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button#submit-btn { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button#submit-btn:hover { background-color: #ff758f; }

        /* Card Styling */
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); }
        .card strong { color: var(--primary); }
        .card small { color: #888; display: block; margin-top: 5px; }
        .card p { margin: 15px 0; line-height: 1.5; }
        .like-btn { background: #fff1f3; border: 1px solid #ffccd5; color: var(--primary); padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .like-btn:hover { background: #ffccd5; }
        
        iframe { border-radius: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 Songfess Online</h2>

    <div class="form-group">
        <input type="text" id="sender" placeholder="Nama Pengirim (Opsional)">
        <input type="text" id="receiver" placeholder="Untuk Siapa? (Wajib)">
        <input type="text" id="song" placeholder="Link Spotify Track (Wajib)">
        <textarea id="message" rows="3" placeholder="Tulis pesan manis kamu... (Wajib)"></textarea>
        <button id="submit-btn" onclick="addSongfess()">Kirim Pesan 💌</button>
    </div>

    <div id="result">
        <p style="text-align: center; color: #888;">Memuat pesan...</p>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  getDocs,
  serverTimestamp,
  query,
  orderBy,
  doc,
  updateDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmWJdT-sumJWd1fKPWvattWKGp9VPFuyk",
  authDomain: "xcavalryonix.firebaseapp.com",
  projectId: "xcavalryonix",
  storageBucket: "xcavalryonix.firebasestorage.app",
  messagingSenderId: "496785985793",
  appId: "1:496785985793:web:56eff97ed61a5c91664b00"
};

// Inisialisasi Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// FUNGSI UNTUK MEMBACA DATA (READ)
async function loadSongfess() {
  const resultDiv = document.getElementById("result");
  if (!resultDiv) return;

  try {
    const q = query(collection(db, "songfess"), orderBy("waktu", "desc"));
    const snapshot = await getDocs(q);
    
    resultDiv.innerHTML = ""; // Bersihkan loading

    if (snapshot.empty) {
        resultDiv.innerHTML = "<p style='text-align:center'>Belum ada pesan masuk.</p>";
        return;
    }

    snapshot.forEach((documentData) => {
      const item = documentData.data();
      const card = document.createElement("div");
      card.className = "card";

      // Ubah link Spotify biasa ke Link Embed
      let songUrl = item.song || "";
      let embedLink = songUrl.replace("track/", "embed/track/").split("?")[0];

      let waktuFormatted = "Baru saja";
      if (item.waktu) {
        waktuFormatted = item.waktu.toDate().toLocaleString("id-ID");
      }

      card.innerHTML = `
        <strong>From:</strong> ${item.sender || "Anonim"}<br>
        <strong>To:</strong> ${item.receiver}<br>
        <small>🕒 ${waktuFormatted}</small>

        <iframe src="${embedLink}" 
          width="100%" height="80" 
          frameborder="0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
        </iframe>

        <p>${item.message}</p>

        <button class="like-btn" data-id="${documentData.id}">
          ❤️ ${item.likes || 0}
        </button>
      `;
      resultDiv.appendChild(card);
    });

    // Pasang Event Listener untuk tombol Like
    document.querySelectorAll(".like-btn").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const id = e.target.getAttribute("data-id");
        await likePost(id);
      });
    });

  } catch (e) {
    console.error("Error load data:", e);
    resultDiv.innerHTML = "Gagal memuat data. Periksa koneksimu.";
  }
}

// FUNGSI UNTUK LIKE
async function likePost(id) {
  try {
    const postRef = doc(db, "songfess", id);
    const snap = await getDoc(postRef);
    if (snap.exists()) {
      const currentLikes = snap.data().likes || 0;
      await updateDoc(postRef, { likes: currentLikes + 1 });
      loadSongfess(); // Refresh data setelah like
    }
  } catch (e) {
    console.error("Gagal like:", e);
  }
}

// FUNGSI UNTUK MENAMBAH DATA (CREATE)
// Kita tempelkan ke window agar bisa dipanggil dari HTML (onclick)
window.addSongfess = async function() {
  const sender = document.getElementById("sender").value;
  const receiver = document.getElementById("receiver").value;
  const song = document.getElementById("song").value;
  const message = document.getElementById("message").value;

  if(!receiver || !song || !message) {
    alert("Mohon isi field Penerima, Lagu, dan Pesan yaa! 😠");
    return;
  }

  const btn = document.getElementById("submit-btn");
  btn.innerText = "Mengirim...";
  btn.disabled = true;

  try {
    await addDoc(collection(db, "songfess"), {
      sender: sender || "Anonim",
      receiver: receiver,
      song: song,
      message: message,
      waktu: serverTimestamp(),
      likes: 0
    });

    alert("Pesan Berhasil Dikirim! 💌");
    
    // Reset Form
    document.getElementById("sender").value = "";
    document.getElementById("receiver").value = "";
    document.getElementById("song").value = "";
    document.getElementById("message").value = "";

    loadSongfess(); // Refresh data
  } catch (e) {
    console.error("Gagal mengirim:", e);
    alert("Waduh, gagal kirim pesan. Coba lagi!");
  } finally {
    btn.innerText = "Kirim Pesan 💌";
    btn.disabled = false;
  }
};

// Jalankan saat pertama kali dibuka
document.addEventListener("DOMContentLoaded", () => {
  loadSongfess();
});
</script>

</body>
</html>
