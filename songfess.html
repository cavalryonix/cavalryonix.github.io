<!DOCTYPE html>
<html>
<head>
  <title>XC Songfess</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f1e9;
      text-align: center;
      padding: 40px;
    }

    input, textarea {
      width: 60%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: black;
      color: white;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 15px auto;
      width: 60%;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    iframe {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h1>🎧 XC Songfess</h1>

  <input type="text" id="song" placeholder="Paste Spotify song link...">
  <br>
  <textarea id="message" rows="4" placeholder="Write your anonymous message..."></textarea>
  <br>
  <button onclick="addSongfess()">Send</button>

  <div id="result"></div>

  <script>
    function addSongfess() {
      var song = document.getElementById("song").value;
      var message = document.getElementById("message").value;

      if(song === "" || message === "") {
        alert("Isi dulu yaa 😠");
        return;
      }

      var embedLink = song.replace("track/", "embed/track/");

      var card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <iframe src="${embedLink}" 
        width="100%" height="80" 
        frameborder="0" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
        </iframe>
        <p>${message}</p>
      `;

      document.getElementById("result").appendChild(card);

      document.getElementById("song").value = "";
      document.getElementById("message").value = "";
    }
  </script>

</body>
</html>
